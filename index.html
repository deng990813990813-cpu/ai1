<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <!-- 設定網頁編碼與響應式顯示 -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 設定瀏覽器分頁標題 -->
  <title>午夜防線｜Nightfall Defense</title>
  <style>
    /* 全域色彩與版面變數 */
    :root{--bg:#070c1b;--panel:#111b30;--line:#263853;--text:#e8f3ff;--muted:#93a8c2;--cyan:#54e5ff;--gold:#ffd078}
    /* 統一盒模型 */
    *{box-sizing:border-box}
    /* 設定頁面背景與字型 */
    body{margin:0;min-height:100vh;color:var(--text);font-family:system-ui,"Microsoft JhengHei",sans-serif;background:radial-gradient(ellipse at 50% 0%,#20375c 0%,#0a142b 45%,#050916 100%);overflow-x:hidden}
    /* 星空覆蓋層 */
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.7;background-image:radial-gradient(1px 1px at 12% 17%,white 95%,transparent),radial-gradient(2px 2px at 75% 13%,white 95%,transparent),radial-gradient(1px 1px at 35% 57%,white 95%,transparent),radial-gradient(1px 1px at 89% 76%,white 95%,transparent);background-size:310px 240px;animation:twinkle 5s ease-in-out infinite alternate}
    /* 星空閃爍動畫 */
    @keyframes twinkle{from{opacity:.25}to{opacity:.9}}
    /* 主內容最大寬度 */
    .wrap{position:relative;max-width:1120px;margin:auto;padding:25px 18px 40px}
    /* 頂部標題列 */
    header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
    /* 主標題 */
    h1{font-size:clamp(24px,4vw,37px);margin:0;letter-spacing:2px}
    /* 小標籤 */
    .tag{color:var(--cyan);font-size:12px;letter-spacing:3px;font-weight:700}
    /* 說明文字 */
    .sub{color:var(--muted);font-size:14px;margin:7px 0 0}
    /* 通用按鈕 */
    button{cursor:pointer;border:1px solid #375272;background:#172944;color:var(--text);border-radius:12px;padding:11px 15px;font-weight:700;transition:.2s}
    /* 按鈕互動效果 */
    button:hover:not(:disabled){transform:translateY(-2px);border-color:var(--cyan);background:#203b5c}
    /* 禁用按鈕 */
    button:disabled{opacity:.4;cursor:not-allowed}
    /* 強調按鈕 */
    .primary{background:linear-gradient(125deg,#127eae,#225cc2);border-color:#4ebfea}
    /* 狀態卡片格線 */
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
    /* 卡片外觀 */
    .stat,.panel,.arena{background:rgba(13,24,45,.88);border:1px solid #2a3d59;border-radius:18px;box-shadow:0 12px 35px #0004}
    /* 狀態卡片內距 */
    .stat{padding:15px 17px}
    /* 狀態標籤 */
    .stat small{display:block;color:var(--muted);margin-bottom:5px}
    /* 狀態數值 */
    .stat strong{font-size:24px}
    /* 主要遊戲佈局 */
    .layout{display:grid;grid-template-columns:minmax(0,1fr) 275px;gap:14px}
    /* 畫布容器 */
    .arena{position:relative;overflow:hidden;padding:10px}
    /* 遊戲畫布 */
    canvas{display:block;width:100%;height:auto;aspect-ratio:800/520;border-radius:12px;cursor:crosshair;touch-action:manipulation}
    /* 遊戲提示 */
    .hint{padding:9px 5px 2px;color:var(--muted);font-size:12px}
    /* 側邊欄 */
    aside{display:flex;flex-direction:column;gap:12px}
    /* 面板內距 */
    .panel{padding:17px}
    /* 面板標題 */
    h2{font-size:15px;margin:0 0 12px}
    /* 防禦塔按鈕 */
    .tower{width:100%;display:flex;align-items:center;gap:11px;text-align:left;margin:9px 0;padding:12px}
    /* 已選擇的塔 */
    .tower.active{border-color:var(--cyan);box-shadow:inset 0 0 0 1px var(--cyan);background:#17415b}
    /* 塔圖示 */
    .emoji{font-size:25px}
    /* 塔資訊 */
    .tower small{display:block;color:var(--muted);margin-top:4px;font-weight:400}
    /* 操作按鈕排列 */
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    /* 日誌區 */
    #log{min-height:46px;color:#a9d5eb;font-size:13px;line-height:1.6}
    /* 小螢幕佈局 */
    @media(max-width:760px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}aside{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}}
    /* 極小螢幕佈局 */
    @media(max-width:480px){aside{grid-template-columns:1fr}.wrap{padding:16px 10px}}
  </style>
</head>
<body>
  <!-- 頁面主容器 -->
  <div class="wrap">
    <!-- 遊戲標題與重設按鈕 -->
    <header><div><div class="tag">STRATEGY / NIGHT MODE</div><h1>🌙 午夜防線</h1><p class="sub">在星光下部署防線，阻止暗影突破基地。</p></div><button id="reset">↻ 重新開始</button></header>
    <!-- 顯示資源與關卡 -->
    <section class="stats"><div class="stat"><small>💰 金幣</small><strong id="gold">180</strong></div><div class="stat"><small>❤️ 基地生命</small><strong id="lives">20</strong></div><div class="stat"><small>🌊 波次</small><strong id="wave">0</strong></div><div class="stat"><small>⭐ 擊敗敵人</small><strong id="kills">0</strong></div></section>
    <!-- 遊戲畫面與控制面板 -->
    <main class="layout">
      <section class="arena"><canvas id="game" width="800" height="520" aria-label="塔防遊戲畫面"></canvas><div class="hint">選擇右側防禦塔，再點擊草地建造；點擊已建造的塔可升級或出售。按空白鍵開始波次。</div></section>
      <aside>
        <!-- 建塔選單 -->
        <section class="panel"><h2>⚡ 防禦設施</h2><button class="tower active" data-type="pulse"><span class="emoji">🔷</span><span>脈衝塔<small>70 金幣｜均衡射速</small></span></button><button class="tower" data-type="sniper"><span class="emoji">🎯</span><span>狙擊塔<small>110 金幣｜高傷害、遠射程</small></span></button><button class="tower" data-type="frost"><span class="emoji">❄️</span><span>冰霜塔<small>95 金幣｜降低敵人速度</small></span></button></section>
        <!-- 波次控制 -->
        <section class="panel"><h2>🎮 戰鬥控制</h2><div class="actions"><button class="primary" id="start">▶ 開始波次</button><button id="pause">⏸ 暫停</button></div><p class="sub">每波敵人更強，完成波次獲得額外金幣。</p></section>
        <!-- 塔升級 -->
        <section class="panel"><h2>🛠️ 防禦塔管理</h2><p id="selectedInfo" class="sub">尚未選擇已建造的塔</p><div class="actions" style="margin-top:12px"><button id="upgrade">⬆ 升級</button><button id="sell">💰 出售</button></div></section>
        <!-- 遊戲通知 -->
        <section class="panel"><h2>📡 戰況資訊</h2><div id="log" aria-live="polite">準備就緒，選擇防禦塔開始部署。</div></section>
      </aside>
    </main>
  </div>
  <script>
    // 取得畫布與 2D 繪圖環境。
    const canvas = document.getElementById("game");
    // 建立畫布繪圖物件。
    const ctx = canvas.getContext("2d");
    // 取得指定 ID 的網頁元素。
    const el = id => document.getElementById(id);
    // 定義防禦塔數值。
    const types = {
      pulse:{cost:70,range:125,damage:19,rate:.48,color:"#56dcff",shot:460},
      sniper:{cost:110,range:215,damage:62,rate:1.55,color:"#ffcf76",shot:700},
      frost:{cost:95,range:112,damage:9,rate:.72,color:"#b5a3ff",shot:390}
    };
    // 設定敵人行進路線。
    const path = [{x:-30,y:120},{x:190,y:120},{x:190,y:360},{x:420,y:360},{x:420,y:175},{x:650,y:175},{x:650,y:410},{x:830,y:410}];
    // 預先計算路線各段長度。
    const lengths = path.slice(1).map((p,i)=>Math.hypot(p.x-path[i].x,p.y-path[i].y));
    // 計算整條路線長度。
    const totalLength = lengths.reduce((a,b)=>a+b,0);
    // 建立可重複使用的距離函式。
    const dist = (a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
    // 限制數值在指定區間內。
    const clamp = (n,a,b)=>Math.max(a,Math.min(b,n));
    // 建立背景星星資料。
    const stars = Array.from({length:90},()=>({x:Math.random()*800,y:Math.random()*520,r:.4+Math.random()*1.3,p:Math.random()*6.28}));
    // 宣告遊戲狀態。
    let gold,lives,wave,kills,towers,enemies,shots,particles,chosen,selected,active,paused,gameOver,spawnLeft,spawnTimer,clock,lastTime;
    // 將遊戲回復初始狀態。
    function reset(){
      // 重設金幣、生命與波次。
      gold=180;lives=20;wave=0;kills=0;
      // 清除所有單位與特效。
      towers=[];enemies=[];shots=[];particles=[];
      // 設定預設建塔類型。
      chosen="pulse";selected=null;
      // 設定遊戲進行旗標。
      active=false;paused=false;gameOver=false;spawnLeft=0;spawnTimer=0;clock=0;
      // 更新按鈕狀態與提示。
      document.querySelectorAll(".tower").forEach(b=>b.classList.toggle("active",b.dataset.type===chosen));
      // 顯示遊戲初始通知。
      message("防線已重設。選擇位置建造防禦塔！");
      // 更新資訊。
      updateUI();
    }
    // 在通知面板顯示文字。
    function message(s){el("log").textContent=s;}
    // 更新所有數值及按鈕。
    function updateUI(){
      // 更新資源顯示。
      el("gold").textContent=gold;el("lives").textContent=lives;el("wave").textContent=wave;el("kills").textContent=kills;
      // 控制開始按鈕。
      el("start").disabled=active||gameOver;
      // 控制暫停按鈕。
      el("pause").disabled=gameOver;
      // 更新暫停按鈕文字。
      el("pause").textContent=paused?"▶ 繼續":"⏸ 暫停";
      // 計算升級所需金幣。
      const cost=selected?Math.round(types[selected.type].cost*(.65+selected.level*.55)):0;
      // 更新選擇塔的說明。
      el("selectedInfo").textContent=selected?`${selected.type==="pulse"?"脈衝":selected.type==="sniper"?"狙擊":"冰霜"}塔 Lv.${selected.level}｜升級 ${cost} 金幣`:"尚未選擇已建造的塔";
      // 控制升級與出售按鈕。
      el("upgrade").disabled=!selected||gold<cost||selected.level>=5||gameOver;
      // 控制出售按鈕。
      el("sell").disabled=!selected||gameOver;
    }
    // 依照行進距離取得路線座標。
    function positionAt(d){
      // 逐段尋找距離所在的路線。
      for(let i=0;i<lengths.length;i++){
        // 若距離位於本段內，使用線性插值。
        if(d<=lengths[i]){const t=clamp(d/lengths[i],0,1);return{x:path[i].x+(path[i+1].x-path[i].x)*t,y:path[i].y+(path[i+1].y-path[i].y)*t};}
        // 扣除已經走過的路段。
        d-=lengths[i];
      }
      // 超出終點時回傳終點。
      return {...path[path.length-1]};
    }
    // 計算點到線段的最短距離。
    function segmentDistance(p,a,b){
      // 計算線段方向向量。
      const dx=b.x-a.x,dy=b.y-a.y;
      // 計算投影比例。
      const t=clamp(((p.x-a.x)*dx+(p.y-a.y)*dy)/(dx*dx+dy*dy),0,1);
      // 回傳點與投影點的距離。
      return Math.hypot(p.x-(a.x+t*dx),p.y-(a.y+t*dy));
    }
    // 判斷指定位置是否能建塔。
    function canBuild(p){
      // 限制塔不能太靠近邊緣。
      if(p.x<25||p.x>775||p.y<25||p.y>495)return false;
      // 禁止在道路上建造。
      if(path.slice(1).some((b,i)=>segmentDistance(p,path[i],b)<37))return false;
      // 禁止防禦塔互相重疊。
      return !towers.some(t=>dist(t,p)<43);
    }
    // 建立新一波敵人。
    function startWave(){
      // 避免重複開始或遊戲結束後開始。
      if(active||gameOver)return;
      // 增加波次。
      wave++;
      // 設定這波的敵人數量。
      spawnLeft=7+wave*3;
      // 讓第一個敵人立即出現。
      spawnTimer=0;
      // 標記波次進行中。
      active=true;paused=false;
      // 更新畫面與通知。
      message(`第 ${wave} 波開始！暗影正在逼近。`);updateUI();
    }
    // 產生一名敵人。
    function spawnEnemy(){
      // 依照波次增加敵人生命。
      const hp=55+wave*22;
      // 建立敵人資料。
      enemies.push({d:0,hp,maxHp:hp,speed:52+Math.min(wave*5,48),slow:0,reward:13+wave*2,phase:Math.random()*6.28});
    }
    // 建立短暫粒子效果。
    function burst(x,y,color,count=7){
      // 依指定數量產生粒子。
      for(let i=0;i<count;i++){const a=Math.random()*Math.PI*2,s=25+Math.random()*95;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.5,max:.5,color});}
    }
    // 更新遊戲模擬。
    function update(dt){
      // 累計動畫時間。
      clock+=dt;
      // 遊戲暫停或結束時不更新戰鬥。
      if(paused||gameOver)return;
      // 持續生成本波敵人。
      if(active&&spawnLeft>0){spawnTimer-=dt;if(spawnTimer<=0){spawnEnemy();spawnLeft--;spawnTimer=Math.max(.36,.9-wave*.025);}}
      // 更新敵人移動。
      for(const e of enemies){
        // 依照減速狀態決定移動速度。
        e.d+=e.speed*(e.slow>0?.48:1)*dt;
        // 減少冰凍效果剩餘時間。
        e.slow=Math.max(0,e.slow-dt);
        // 更新敵人目前座標。
        Object.assign(e,positionAt(e.d));
        // 抵達終點時扣除基地生命。
        if(e.d>=totalLength){e.hp=0;e.escaped=true;lives=Math.max(0,lives-1);burst(790,410,"#ff697f");}
      }
      // 更新防禦塔攻擊。
      for(const t of towers){
        // 減少攻擊冷卻時間。
        t.cool-=dt;
        // 取得防禦塔屬性。
        const spec=types[t.type];
        // 依照距離與路程挑選目標。
        const target=enemies.filter(e=>e.hp>0&&dist(t,e)<spec.range+10*(t.level-1)).sort((a,b)=>b.d-a.d)[0];
        // 冷卻完成且有目標時射擊。
        if(target&&t.cool<=0){
          // 設定下一次射擊時間。
          t.cool=spec.rate/Math.pow(1.12,t.level-1);
          // 建立追蹤彈。
          shots.push({x:t.x,y:t.y,target,type:t.type,damage:spec.damage*(1+.55*(t.level-1)),speed:spec.shot,color:spec.color});
        }
      }
      // 更新子彈位置與命中判斷。
      for(const s of shots){
        // 若目標已死亡，移除子彈。
        if(s.target.hp<=0){s.dead=true;continue;}
        // 計算子彈與目標距離。
        const d=dist(s,s.target);
        // 判斷子彈是否命中。
        if(d<s.speed*dt+11){
          // 扣除敵人生命。
          s.target.hp-=s.damage;
          // 冰霜塔命中時附加減速。
          if(s.type==="frost")s.target.slow=1.5;
          // 產生命中特效。
          burst(s.target.x,s.target.y,s.color,4);
          // 標記子彈已命中。
          s.dead=true;
        }else{
          // 沿著目標方向移動子彈。
          s.x+=(s.target.x-s.x)/d*s.speed*dt;s.y+=(s.target.y-s.y)/d*s.speed*dt;
        }
      }
      // 移除已命中的子彈。
      shots=shots.filter(s=>!s.dead);
      // 結算死亡與逃脫敵人。
      for(const e of enemies.filter(e=>e.hp<=0&&!e.escaped)){gold+=e.reward;kills++;burst(e.x,e.y,"#ffae80",10);}
      // 清理死亡敵人。
      enemies=enemies.filter(e=>e.hp>0);
      // 更新粒子。
      for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;}
      // 清除已結束的粒子。
      particles=particles.filter(p=>p.life>0);
      // 檢查基地是否失守。
      if(lives<=0){gameOver=true;active=false;message(`基地失守！你堅守到第 ${wave} 波，擊敗 ${kills} 名敵人。`);}
      // 檢查波次是否完成。
      else if(active&&spawnLeft===0&&enemies.length===0){active=false;const bonus=30+wave*10;gold+=bonus;message(`第 ${wave} 波完成！獲得 ${bonus} 金幣獎勵。`);}
      // 同步最新數值。
      updateUI();
    }
    // 繪製圓形工具函式。
    function circle(x,y,r,color){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();}
    // 繪製夜晚背景。
    function drawBackground(){
      // 填滿深藍色地面。
      const g=ctx.createLinearGradient(0,0,800,520);g.addColorStop(0,"#142b41");g.addColorStop(1,"#091b2b");ctx.fillStyle=g;ctx.fillRect(0,0,800,520);
      // 繪製閃爍星點。
      for(const s of stars){ctx.globalAlpha=.15+.4*(.5+.5*Math.sin(clock*1.5+s.p));circle(s.x,s.y,s.r,"#b7e6ff");}ctx.globalAlpha=1;
      // 繪製月光暈影。
      const moon=ctx.createRadialGradient(725,55,5,725,55,150);moon.addColorStop(0,"#c7e5ff33");moon.addColorStop(1,"#c7e5ff00");ctx.fillStyle=moon;ctx.fillRect(570,0,230,210);
      // 繪製月亮。
      circle(728,62,24,"#dcecff");circle(738,53,22,"#172e45");
      // 繪製地面裝飾格線。
      ctx.strokeStyle="#85c7e00a";ctx.lineWidth=1;for(let x=0;x<800;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,520);ctx.stroke();}for(let y=0;y<520;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(800,y);ctx.stroke();}
      // 繪製道路底部光暈。
      ctx.lineJoin="round";ctx.lineCap="round";ctx.beginPath();path.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.strokeStyle="#3e719355";ctx.lineWidth=67;ctx.stroke();
      // 繪製主要道路。
      ctx.strokeStyle="#263c51";ctx.lineWidth=54;ctx.stroke();
      // 繪製道路邊緣。
      ctx.strokeStyle="#4b7790";ctx.lineWidth=2;ctx.stroke();
      // 繪製道路中線。
      ctx.setLineDash([12,18]);ctx.strokeStyle="#7cb5c744";ctx.lineWidth=2;ctx.stroke();ctx.setLineDash([]);
      // 繪製終點基地。
      circle(775,410,26,"#123f56");circle(775,410,17,"#46d8f544");circle(775,410,9,"#79ecff");
    }
    // 繪製所有防禦塔。
    function drawTowers(){
      // 逐一繪製塔。
      for(const t of towers){
        // 取得塔的顏色。
        const c=types[t.type].color;
        // 選取塔時顯示射程。
        if(t===selected){circle(t.x,t.y,types[t.type].range+10*(t.level-1),c+"16");ctx.beginPath();ctx.arc(t.x,t.y,types[t.type].range+10*(t.level-1),0,Math.PI*2);ctx.strokeStyle=c+"66";ctx.lineWidth=1;ctx.stroke();}
        // 繪製塔底座。
        circle(t.x,t.y,21,"#09111f");circle(t.x,t.y,17,"#29465f");
        // 繪製發光塔核心。
        ctx.shadowBlur=16;ctx.shadowColor=c;circle(t.x,t.y,10,c);ctx.shadowBlur=0;
        // 繪製塔的等級。
        ctx.fillStyle="#fff";ctx.font="bold 11px system-ui";ctx.textAlign="center";ctx.fillText(t.level,t.x,t.y+4);
      }
    }
    // 繪製敵人。
    function drawEnemies(){
      // 逐一繪製敵人與血條。
      for(const e of enemies){
        // 繪製敵人的發光外框。
        ctx.shadowBlur=13;ctx.shadowColor=e.slow>0?"#9cdfff":"#ff658e";circle(e.x,e.y,13,e.slow>0?"#9adfff":"#f16b90");ctx.shadowBlur=0;
        // 繪製敵人內核。
        circle(e.x,e.y,7,"#4d1d42");
        // 繪製生命條底色。
        ctx.fillStyle="#0a1020";ctx.fillRect(e.x-17,e.y-24,34,5);
        // 繪製剩餘生命。
        ctx.fillStyle=e.slow>0?"#78e9ff":"#7bf4b1";ctx.fillRect(e.x-17,e.y-24,34*clamp(e.hp/e.maxHp,0,1),5);
      }
    }
    // 繪製子彈與粒子。
    function drawEffects(){
      // 繪製子彈光點。
      for(const s of shots){ctx.shadowBlur=15;ctx.shadowColor=s.color;circle(s.x,s.y,4,s.color);}ctx.shadowBlur=0;
      // 繪製逐漸消失的粒子。
      for(const p of particles){ctx.globalAlpha=clamp(p.life/p.max,0,1);circle(p.x,p.y,2.5,p.color);}ctx.globalAlpha=1;
    }
    // 繪製暫停與結束覆蓋層。
    function drawOverlay(){
      // 正常遊戲時不顯示覆蓋層。
      if(!paused&&!gameOver)return;
      // 繪製半透明遮罩。
      ctx.fillStyle="#030817ba";ctx.fillRect(0,0,800,520);
      // 顯示狀態文字。
      ctx.fillStyle="#eaf7ff";ctx.textAlign="center";ctx.font="bold 43px system-ui";ctx.fillText(gameOver?"基地失守":"遊戲暫停",400,245);
      // 顯示操作提示。
      ctx.font="17px system-ui";ctx.fillStyle="#9fc1d7";ctx.fillText(gameOver?"點擊「重新開始」再次挑戰":"點擊「繼續」恢復戰鬥",400,283);
    }
    // 執行每一影格。
    function frame(time){
      // 計算與上一影格的時間差。
      const dt=Math.min((time-(lastTime||time))/1000,.04);
      // 儲存目前時間。
      lastTime=time;
      // 更新遊戲邏輯。
      update(dt);
      // 清空並重新繪製遊戲。
      drawBackground();drawTowers();drawEnemies();drawEffects();drawOverlay();
      // 請求下一個動畫影格。
      requestAnimationFrame(frame);
    }
    // 處理畫布點擊事件。
    canvas.addEventListener("click",event=>{
      // 結束或暫停時不接受操作。
      if(gameOver||paused)return;
      // 依照畫布縮放比例換算座標。
      const r=canvas.getBoundingClientRect(),p={x:(event.clientX-r.left)*800/r.width,y:(event.clientY-r.top)*520/r.height};
      // 優先選取既有防禦塔。
      const hit=towers.find(t=>dist(t,p)<23);
      // 選到既有塔時開啟管理。
      if(hit){selected=hit;message(`已選取 Lv.${hit.level} 防禦塔。`);updateUI();return;}
      // 點擊空地時取消已選擇的塔。
      selected=null;
      // 檢查建塔位置。
      if(!canBuild(p)){message("這個位置不能建造防禦塔。");updateUI();return;}
      // 取得建塔價格。
      const spec=types[chosen];
      // 檢查金幣是否足夠。
      if(gold<spec.cost){message(`金幣不足！需要 ${spec.cost} 金幣。`);updateUI();return;}
      // 扣除建塔金幣。
      gold-=spec.cost;
      // 新增防禦塔。
      towers.push({x:p.x,y:p.y,type:chosen,level:1,cool:0,spent:spec.cost});
      // 播放建造粒子效果。
      burst(p.x,p.y,spec.color,12);
      // 顯示建造通知。
      message("防禦塔建造完成！");updateUI();
    });
    // 設定防禦塔選擇按鈕。
    document.querySelectorAll(".tower").forEach(b=>b.addEventListener("click",()=>{
      // 儲存目前選擇的類型。
      chosen=b.dataset.type;selected=null;
      // 更新選擇按鈕外觀。
      document.querySelectorAll(".tower").forEach(x=>x.classList.toggle("active",x===b));
      // 顯示建塔提示。
      message("點擊地圖上的空地即可建造。");updateUI();
    }));
    // 綁定開始波次按鈕。
    el("start").addEventListener("click",startWave);
    // 綁定暫停與繼續按鈕。
    el("pause").addEventListener("click",()=>{paused=!paused;message(paused?"遊戲已暫停。":"戰鬥繼續！");updateUI();});
    // 綁定重設按鈕。
    el("reset").addEventListener("click",reset);
    // 綁定升級按鈕。
    el("upgrade").addEventListener("click",()=>{
      // 沒有選取塔時直接返回。
      if(!selected||selected.level>=5)return;
      // 計算升級價格。
      const cost=Math.round(types[selected.type].cost*(.65+selected.level*.55));
      // 金幣不足時不升級。
      if(gold<cost)return;
      // 扣除升級費用。
      gold-=cost;selected.spent+=cost;selected.level++;
      // 顯示升級特效。
      burst(selected.x,selected.y,types[selected.type].color,15);
      // 更新升級提示。
      message(`升級成功！目前 Lv.${selected.level}`);updateUI();
    });
    // 綁定出售按鈕。
    el("sell").addEventListener("click",()=>{
      // 未選取塔時不出售。
      if(!selected)return;
      // 返還累積花費的 60%。
      const refund=Math.floor(selected.spent*.6);gold+=refund;
      // 從塔陣列移除。
      towers=towers.filter(t=>t!==selected);selected=null;
      // 顯示出售通知。
      message(`防禦塔已出售，返還 ${refund} 金幣。`);updateUI();
    });
    // 支援空白鍵開始波次。
    window.addEventListener("keydown",e=>{if(e.code==="Space"&&!e.repeat&&e.target.tagName!=="BUTTON"){e.preventDefault();startWave();}});
    // 初始化遊戲。
    reset();
    // 啟動動畫循環。
    requestAnimationFrame(frame);
  </script>
</body>
</html>
